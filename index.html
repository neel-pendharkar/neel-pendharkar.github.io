<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Neel Pendharkar's personal website.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111111">
    <title>Neel Pendharkar</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Neel Pendharkar</span>
      </a>
    </header>

    <main class="content">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Personal website</p>
        <h1 id="page-title">Neel Pendharkar</h1>
      </section>

      <details class="routine">
        <summary>
          <span>Routine</span>
          <span class="routine-action">View workout &amp; diet</span>
        </summary>
        <div class="details">
          <section class="workout-card" aria-labelledby="workout-title">
            <div class="section-heading">
              <p class="eyebrow">Daily</p>
              <h2 id="workout-title">Workout</h2>
            </div>
            <div id="workout-list" class="workout-grid">
              <p class="loading">Loading…</p>
            </div>
          </section>

          <section class="diet-card" aria-labelledby="diet-title">
            <div class="section-heading">
              <p class="eyebrow">Diet</p>
              <h2 id="diet-title">Food</h2>
            </div>
            <div class="diet-grid">
              <div class="diet-item"><strong>Whole</strong><span>foods only</span></div>
              <div class="diet-item"><strong>Fiber</strong><span>first</span></div>
              <div class="diet-item"><strong>Non-veg</strong><span>diet</span></div>
              <div class="diet-item"><strong>Home</strong><span>cooked only</span></div>
              <div class="diet-item"><strong>Light</strong><span>oil &amp; spices</span></div>
              <div class="diet-item"><strong>7 · 2</strong><span>AM · PM</span></div>
            </div>
          </section>
        </div>
      </details>
    </main>
  </body>
</html>
